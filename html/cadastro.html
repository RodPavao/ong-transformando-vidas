<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>ONG - Cadastro</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header>
    <h1>Cadastro</h1>
    <p>Preencha seus dados para participar das ações da ONG.</p>
</header>

<nav class="menu-principal">

    <button class="menu-hamburguer" type="button" aria-label="Abrir menu">
        ☰
    </button>

    <div class="menu-links">
        <a href="index.html">Início</a>

        <div class="menu-dropdown">
            <a href="projetos.html">Projetos Sociais</a>

            <div class="submenu">
                <a href="projetos.html">Doações</a>
                <a href="projetos.html">Voluntariado</a>
            </div>
        </div>

        <a href="cadastro.html">Cadastro</a>
    </div>

</nav>

<main>

    <form>

        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" title="Formato: 000.000.000-00" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" pattern="\(\d{2}\) \d{5}-\d{4}" title="Formato: (00) 00000-0000" required>
        </fieldset>

        <fieldset>
            <legend>Endereço</legend>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" title="Formato: 00000-000" required>

            <label for="rua">Rua:</label>
            <input type="text" id="rua" name="rua" required>

            <label for="numero">Número:</label>
            <input type="text" id="numero" name="numero" required>

            <label for="bairro">Bairro:</label>
            <input type="text" id="bairro" name="bairro" required>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" required>

            <label for="estado">Estado:</label>
            <input type="text" id="estado" name="estado" required>
        </fieldset>

        <button type="submit">Enviar cadastro</button>
        
    </form>

</main>

<footer>
    <p>&copy; 2026 ONG - Transformando Vidas</p>
</footer>

</body>

</html>
